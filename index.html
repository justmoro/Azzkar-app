<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>حصن اليوم | أذكار الصباح والمساء</title>
<meta name="description" content="تطبيق أذكار الصباح والمساء مع عدّاد تفاعلي وسبحة رقمية">
<meta name="theme-color" content="#0f3d3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --dawn-1:#f6ead2;
    --dawn-2:#e9c9a3;
    --dusk-1:#1b2a4a;
    --dusk-2:#0c1424;
    --ink:#1c231f;
    --paper:#fbf6ec;
    --brass:#b8894f;
    --brass-deep:#8a5f30;
    --emerald:#0f3d3a;
    --emerald-deep:#082623;
    --glass:rgba(251,246,236,0.62);
    --glass-border:rgba(184,137,79,0.35);
    --shadow:0 20px 50px -20px rgba(8,38,35,0.45);
    --radius:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(184,137,79,0.25), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(15,61,58,0.35), transparent 55%),
      linear-gradient(180deg, var(--dawn-1) 0%, var(--dawn-2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh;
    transition:background 1.2s ease;
    overflow-x:hidden;
  }
  body.mode-evening{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(184,137,79,0.12), transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, rgba(255,255,255,0.06), transparent 55%),
      linear-gradient(180deg, var(--dusk-1) 0%, var(--dusk-2) 100%);
    color:#eee6d6;
  }

  /* ambient stars for evening mode */
  .stars{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease;z-index:0;}
  body.mode-evening .stars{opacity:1;}
  .star{position:absolute;width:2px;height:2px;background:#f6ead2;border-radius:50%;animation:twinkle 3.5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}

  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px;position:relative;z-index:1;}

  header.top{text-align:center;padding:18px 0 8px;}
  .eyebrow{
    font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--brass-deep);font-weight:700;
  }
  body.mode-evening .eyebrow{color:#d8b57e;}
  h1.title{
    font-family:'Amiri',serif;
    font-size:clamp(34px,7vw,52px);
    margin:6px 0 2px;
    font-weight:700;
    color:var(--emerald);
  }
  body.mode-evening h1.title{color:#f6ead2;}
  .subtitle{font-size:14.5px;opacity:.75;margin-bottom:6px;}

  .hijri{font-size:13px;opacity:.65;margin-top:2px;}

  /* mode toggle */
  .mode-toggle{
    display:flex;justify-content:center;gap:8px;margin:22px 0 6px;
  }
  .mode-btn{
    border:1px solid var(--glass-border);
    background:var(--glass);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:inherit;
    padding:9px 18px;
    border-radius:999px;
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    transition:all .25s ease;
  }
  .mode-btn.active{
    background:var(--emerald);
    color:#f6ead2;
    border-color:var(--emerald);
  }
  body.mode-evening .mode-btn.active{
    background:var(--brass);
    color:#1b2a4a;
    border-color:var(--brass);
  }

  /* progress ring header */
  .day-progress{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin:22px 0 10px;
  }
  .ring{width:64px;height:64px;position:relative;flex:0 0 auto;}
  .ring svg{transform:rotate(-90deg);width:100%;height:100%;}
  .ring circle{fill:none;stroke-width:6;}
  .ring .bg{stroke:rgba(184,137,79,0.22);}
  .ring .fg{stroke:var(--brass);stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  body.mode-evening .ring .fg{stroke:#eee6d6;}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .progress-text{font-size:13.5px;opacity:.8;text-align:right;}
  .progress-text b{font-family:'Amiri',serif;font-size:16px;}

  /* cards */
  .section-label{
    font-family:'Amiri',serif;
    font-size:22px;
    margin:34px 4px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--emerald);
  }
  body.mode-evening .section-label{color:#f6ead2;}
  .section-label .dash{flex:1;height:1px;background:linear-gradient(90deg,var(--brass),transparent);}

  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 22px 18px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
    transition:transform .2s ease, opacity .4s ease;
  }
  body.mode-evening .card{
    background:rgba(255,255,255,0.05);
    border-color:rgba(255,255,255,0.12);
  }
  .card.done{opacity:.5;}
  .card.done .zikr-text{text-decoration:line-through;text-decoration-color:var(--brass);text-decoration-thickness:1.5px;}
  .card.active{
    border-color:var(--brass);
    box-shadow:0 0 0 2px rgba(184,137,79,0.35), var(--shadow);
    transform:scale(1.015);
  }
  body.mode-evening .card.active{
    border-color:#d8b57e;
    box-shadow:0 0 0 2px rgba(216,181,126,0.3), var(--shadow);
  }
  .active-badge{
    font-size:11px;font-weight:700;
    background:var(--emerald);color:#f6ead2;
    padding:3px 10px;border-radius:999px;
    flex:0 0 auto;
  }
  body.mode-evening .active-badge{background:var(--brass);color:#1b2a4a;}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .zikr-num{
    font-family:'Amiri',serif;font-size:13px;color:var(--brass-deep);
    background:rgba(184,137,79,0.14);
    border-radius:8px;padding:3px 10px;flex:0 0 auto;
  }
  body.mode-evening .zikr-num{color:#d8b57e;background:rgba(216,181,126,0.12);}

  .zikr-text{
    font-family:'Amiri',serif;
    font-size:clamp(19px,3.4vw,23px);
    line-height:2.05;
    text-align:right;
  }
  .zikr-note{font-size:12.5px;opacity:.65;margin-top:8px;}

  .audio-row{margin-top:12px;}
  .audio-btn{
    border:1px solid var(--glass-border);
    background:rgba(184,137,79,0.12);
    color:var(--brass-deep);
    font-family:'Tajawal',sans-serif;
    font-size:12.5px;font-weight:700;
    padding:7px 14px;border-radius:999px;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:all .2s ease;
  }
  body.mode-evening .audio-btn{color:#d8b57e;background:rgba(216,181,126,0.1);}
  .audio-btn.playing{background:var(--emerald);color:#f6ead2;border-color:var(--emerald);}
  body.mode-evening .audio-btn.playing{background:var(--brass);color:#1b2a4a;border-color:var(--brass);}
  .audio-unavailable{font-size:11.5px;opacity:.5;font-style:italic;}

  .counter-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:16px;padding-top:14px;
    border-top:1px dashed var(--glass-border);
  }
  .count-btn{
    border:none;
    width:52px;height:52px;border-radius:50%;
    background:var(--emerald);color:#f6ead2;
    font-size:20px;font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, background .2s ease;
    box-shadow:0 8px 20px -8px rgba(15,61,58,0.6);
  }
  body.mode-evening .count-btn{background:var(--brass);color:#1b2a4a;}
  .count-btn:active{transform:scale(.88);}
  .count-btn.finished{background:#4b8a63;}

  .count-display{font-family:'Amiri',serif;font-size:15px;letter-spacing:.02em;}
  .count-display b{font-size:20px;}

  /* tasbih floating widget */
  .tasbih-card{
    text-align:center;
    padding:34px 22px;
  }
  .tasbih-big{
    font-family:'Amiri',serif;
    font-size:64px;
    margin:6px 0 2px;
    color:var(--emerald);
  }
  body.mode-evening .tasbih-big{color:#f6ead2;}
  .tasbih-phrase{font-size:16px;margin-bottom:20px;opacity:.85;}
  .tasbih-tap{
    width:150px;height:150px;border-radius:50%;
    margin:0 auto;
    border:2px solid var(--brass);
    background:radial-gradient(circle at 35% 30%, rgba(184,137,79,0.25), transparent 70%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Amiri',serif;font-size:15px;
    cursor:pointer;
    user-select:none;
    transition:transform .1s ease;
  }
  .tasbih-tap:active{transform:scale(.94);}
  .tasbih-controls{margin-top:18px;display:flex;justify-content:center;gap:10px;}
  .ghost-btn{
    background:transparent;border:1px solid var(--glass-border);
    color:inherit;padding:8px 16px;border-radius:999px;
    font-family:'Tajawal',sans-serif;font-size:13px;cursor:pointer;
  }

  footer{
    text-align:center;margin-top:40px;font-size:12.5px;opacity:.55;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">حصنك اليومي</div>
    <h1 class="title">أذكار الصباح والمساء</h1>
    <div class="subtitle">اقرأ، اعدّ، واطمئنّ قلبك بذكر الله</div>
    <div class="hijri" id="todayDate"></div>
  </header>

  <div class="mode-toggle">
    <button class="mode-btn" id="btnMorning">أذكار الصباح</button>
    <button class="mode-btn" id="btnEvening">أذكار المساء</button>
    <button class="mode-btn" id="btnTasbih">السبحة</button>
  </div>

  <div class="day-progress" id="progressWrap">
    <div class="progress-text">
      أنجزت <b id="progressCount">0</b> من <span id="progressTotal">0</span> اليوم
    </div>
    <div class="ring">
      <svg viewBox="0 0 64 64">
        <circle class="bg" cx="32" cy="32" r="27"></circle>
        <circle class="fg" id="ringFg" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"></circle>
      </svg>
      <div class="ring-label" id="ringLabel">0%</div>
    </div>
  </div>

  <div id="azkarView">
    <div class="section-label"><span id="sectionTitle">أذكار الصباح</span><span class="dash"></span></div>
    <div id="cardsHost"></div>
  </div>

  <div id="tasbihView" style="display:none;">
    <div class="section-label"><span>السبحة الرقمية</span><span class="dash"></span></div>
    <div class="card tasbih-card">
      <div class="tasbih-phrase" id="tasbihPhrase">سبحان الله وبحمده</div>
      <div class="tasbih-big" id="tasbihCount">0</div>
      <div class="tasbih-tap" id="tasbihTap">اضغط للعدّ</div>
      <div class="tasbih-controls">
        <button class="ghost-btn" id="tasbihReset">تصفير</button>
        <button class="ghost-btn" id="tasbihPhraseSwap">تبديل الذكر</button>
      </div>
    </div>
  </div>

  <footer>صُنع بمحبة لوجه الله · بياناتك تبقى على جهازك فقط</footer>
</div>

<script>
(function(){
  "use strict";

  // روابط التلاوة من everyayah.com (الشيخ مشاري العفاسي) — كل رقم بصيغة سورة+آية من 3 خانات
  const QA = "https://everyayah.com/data/Alafasy_128kbps/";
  const ayahKursi = [QA+"002255.mp3"];
  const surahIkhlas = [QA+"112001.mp3", QA+"112002.mp3", QA+"112003.mp3"];
  const surahFalaq = [QA+"113001.mp3", QA+"113002.mp3", QA+"113003.mp3", QA+"113004.mp3", QA+"113005.mp3"];
  const surahNas = [QA+"114001.mp3", QA+"114002.mp3", QA+"114003.mp3", QA+"114004.mp3", QA+"114005.mp3", QA+"114006.mp3"];

  const morningAzkar = [
    {text:"أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ، اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ...", note:"آية الكرسي — مرة واحدة", target:1, audio:ayahKursi},
    {text:"قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ", note:"سورة الإخلاص — ثلاث مرات", target:3, audio:surahIkhlas},
    {text:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ...", note:"سورة الفلق — ثلاث مرات", target:3, audio:surahFalaq},
    {text:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ...", note:"سورة الناس — ثلاث مرات", target:3, audio:surahNas},
    {text:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", note:"مرة واحدة", target:1},
    {text:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ...", note:"سيد الاستغفار — مرة واحدة", target:1},
    {text:"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ", note:"ثلاث مرات", target:3},
    {text:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا", note:"ثلاث مرات", target:3},
    {text:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", note:"مئة مرة", target:100},
    {text:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", note:"عشر مرات", target:10},
    {text:"أَصْبَحْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ، وَعَلَىٰ دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ", note:"مرة واحدة", target:1}
  ];

  const eveningAzkar = [
    {text:"أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ، اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ...", note:"آية الكرسي — مرة واحدة", target:1, audio:ayahKursi},
    {text:"قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ", note:"سورة الإخلاص — ثلاث مرات", target:3, audio:surahIkhlas},
    {text:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ...", note:"سورة الفلق — ثلاث مرات", target:3, audio:surahFalaq},
    {text:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ...", note:"سورة الناس — ثلاث مرات", target:3, audio:surahNas},
    {text:"أَمْسَيْنَا وَأَمْسَىٰ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", note:"مرة واحدة", target:1},
    {text:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ...", note:"سيد الاستغفار — مرة واحدة", target:1},
    {text:"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ", note:"ثلاث مرات", target:3},
    {text:"أَمْسَيْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ، وَعَلَىٰ دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ", note:"مرة واحدة", target:1},
    {text:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", note:"مئة مرة", target:100},
    {text:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِن شَرِّ مَا خَلَقَ", note:"ثلاث مرات", target:3},
    {text:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ", note:"مرة واحدة", target:1}
  ];

  const tasbihPhrases = ["سبحان الله وبحمده","سبحان الله","الحمد لله","لا إله إلا الله","الله أكبر","لا حول ولا قوة إلا بالله"];

  const state = {
    mode: "morning",
    morning: loadCounts("morning", morningAzkar.length),
    evening: loadCounts("evening", eveningAzkar.length),
    tasbihIdx: 0,
    tasbihCount: parseInt(localStorage.getItem("tasbih_count")||"0",10),
    playingKey: null
  };

  function todayKey(){
    const d = new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }

  function loadCounts(key, len){
    const stored = JSON.parse(localStorage.getItem("azkar_"+key)||"null");
    if(stored && stored.day === todayKey() && stored.counts && stored.counts.length === len){
      return stored.counts;
    }
    return new Array(len).fill(0);
  }

  function saveCounts(key, counts){
    localStorage.setItem("azkar_"+key, JSON.stringify({day: todayKey(), counts}));
  }

  const cardsHost = document.getElementById("cardsHost");
  const sectionTitle = document.getElementById("sectionTitle");
  const azkarView = document.getElementById("azkarView");
  const tasbihView = document.getElementById("tasbihView");
  const progressWrap = document.getElementById("progressWrap");

  function currentList(){ return state.mode === "morning" ? morningAzkar : eveningAzkar; }
  function currentCounts(){ return state.mode === "morning" ? state.morning : state.evening; }

  function render(){
    const list = currentList();
    const counts = currentCounts();
    sectionTitle.textContent = state.mode === "morning" ? "أذكار الصباح" : "أذكار المساء";
    const activeIdx = counts.findIndex((c,i)=> c < list[i].target);
    cardsHost.innerHTML = "";
    list.forEach((z, i) => {
      const done = counts[i] >= z.target;
      const isActive = i === activeIdx;
      const card = document.createElement("div");
      card.className = "card" + (done ? " done" : "") + (isActive ? " active" : "");
      card.dataset.idx = i;
      const playing = state.playingKey === (state.mode+"-"+i);
      const audioBtn = z.audio
        ? `<button class="audio-btn ${playing ? "playing" : ""}" data-audio-idx="${i}" aria-label="استماع">${playing ? "⏸" : "▶"} استماع</button>`
        : `<span class="audio-unavailable">لا تتوفر تلاوة صوتية لهذا الذكر</span>`;
      card.innerHTML = `
        <div class="card-top">
          <span class="zikr-num">${i+1} / ${list.length}</span>
          ${isActive ? '<span class="active-badge">الذكر الحالي</span>' : ''}
        </div>
        <div class="zikr-text">${z.text}</div>
        <div class="zikr-note">${z.note}</div>
        <div class="audio-row">${audioBtn}</div>
        <div class="counter-row">
          <div class="count-display">${done ? "✓ تم" : "<b>"+counts[i]+"</b> / "+z.target}</div>
          <button class="count-btn ${done ? "finished" : ""}" data-idx="${i}" aria-label="عدّ">${done ? "✓" : "+"}</button>
        </div>
      `;
      cardsHost.appendChild(card);
    });
    updateProgress();
  }

  cardsHost.addEventListener("click", function(e){
    const countBtn = e.target.closest(".count-btn");
    if(countBtn){
      const i = parseInt(countBtn.dataset.idx, 10);
      incrementZikr(i);
      return;
    }
    const audioBtn = e.target.closest(".audio-btn");
    if(audioBtn){
      const i = parseInt(audioBtn.dataset.audioIdx, 10);
      toggleAudio(i);
    }
  });

  // يزيد عداد ذكر معيّن بمقدار مرة واحدة، ويحفظ، ويحدّث الواجهة،
  // ولو اكتمل عدد المرات المطلوب ينتقل تلقائيًا (سكرول) للذكر التالي غير المكتمل
  function incrementZikr(i){
    const counts = currentCounts();
    const target = currentList()[i].target;
    if(counts[i] >= target) return false;
    counts[i]++;
    const justCompleted = counts[i] === target;
    if(navigator.vibrate) navigator.vibrate(8);
    saveCounts(state.mode, counts);
    render();
    if(justCompleted){
      const list = currentList();
      const nextCounts = currentCounts();
      const nextIdx = nextCounts.findIndex((c,idx)=> c < list[idx].target);
      if(nextIdx !== -1){
        requestAnimationFrame(()=>{
          const nextCard = cardsHost.querySelector('[data-idx="'+nextIdx+'"]');
          if(nextCard) nextCard.scrollIntoView({behavior:"smooth", block:"center"});
        });
      } else {
        // كل الأذكار في هذا القسم اكتملت
        if(navigator.vibrate) navigator.vibrate([10,40,10]);
      }
    }
    return justCompleted;
  }

  // مشغّل صوتي متسلسل لتلاوة الآيات المرتبطة بكل ذكر — يكرر التلاوة كاملة
  // بعدد المرات المتبقية من هدف التكرار، ويزيد العداد تلقائيًا بعد كل مرة كاملة
  const player = new Audio();
  let playQueue = [];
  let playQueueIdx = 0;
  let ayahsPerRep = 1;
  let activeZikrIdx = -1;

  function stopAudio(){
    player.pause();
    player.currentTime = 0;
    state.playingKey = null;
    activeZikrIdx = -1;
    render();
  }

  player.addEventListener("ended", function(){
    playQueueIdx++;
    // هل اكتملت مرة كاملة من التلاوة (كل آيات السورة/الآية)؟
    if(activeZikrIdx !== -1 && playQueueIdx % ayahsPerRep === 0){
      const stillGoing = incrementZikr(activeZikrIdx);
      // لو الذكر خلص (وصل للهدف) أو مفيش حاجة تانية في الطابور، وقف التشغيل
      if(playQueueIdx >= playQueue.length){
        stopAudio();
        return;
      }
    }
    if(playQueueIdx < playQueue.length){
      player.src = playQueue[playQueueIdx];
      player.play().catch(()=> stopAudio());
    } else {
      stopAudio();
    }
  });

  function toggleAudio(i){
    const key = state.mode + "-" + i;
    if(state.playingKey === key){
      stopAudio();
      return;
    }
    // لو فيه تلاوة تانية شغالة لذكر مختلف، وقّفها الأول
    if(state.playingKey){
      player.pause();
    }
    const list = currentList();
    const z = list[i];
    if(!z.audio || !z.audio.length) return;
    const counts = currentCounts();
    const remainingReps = z.target - counts[i];
    if(remainingReps <= 0) return;
    // ابنِ طابور تشغيل يكرر آيات الذكر بعدد المرات المتبقية لإتمام الهدف
    playQueue = [];
    for(let r = 0; r < remainingReps; r++){
      z.audio.forEach(url => playQueue.push(url));
    }
    ayahsPerRep = z.audio.length;
    playQueueIdx = 0;
    activeZikrIdx = i;
    player.src = playQueue[0];
    state.playingKey = key;
    render();
    player.play().catch(()=>{
      alert("تعذّر تشغيل التلاوة الآن، تأكد من اتصالك بالإنترنت.");
      stopAudio();
    });
  }

  function updateProgress(){
    const list = currentList();
    const counts = currentCounts();
    const doneCount = counts.filter((c,i)=>c>=list[i].target).length;
    document.getElementById("progressCount").textContent = doneCount;
    document.getElementById("progressTotal").textContent = list.length;
    const pct = list.length ? doneCount/list.length : 0;
    const circumference = 169.6;
    document.getElementById("ringFg").style.strokeDashoffset = circumference * (1-pct);
    document.getElementById("ringLabel").textContent = Math.round(pct*100)+"%";
  }

  const btnMorning = document.getElementById("btnMorning");
  const btnEvening = document.getElementById("btnEvening");
  const btnTasbih = document.getElementById("btnTasbih");

  function setActiveBtn(btn){
    [btnMorning, btnEvening, btnTasbih].forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
  }

  function showAzkar(mode){
    if(state.playingKey) stopAudio();
    state.mode = mode;
    azkarView.style.display = "";
    tasbihView.style.display = "none";
    progressWrap.style.display = "flex";
    document.body.classList.toggle("mode-evening", mode === "evening");
    setActiveBtn(mode === "morning" ? btnMorning : btnEvening);
    render();
  }

  function getAutoMode(){
    const hour = new Date().getHours();
    return (hour >= 15 || hour < 4) ? "evening" : "morning";
  }

  let userPickedManually = false;

  btnMorning.addEventListener("click", ()=>{ userPickedManually = true; showAzkar("morning"); });
  btnEvening.addEventListener("click", ()=>{ userPickedManually = true; showAzkar("evening"); });
  btnTasbih.addEventListener("click", ()=>{
    if(state.playingKey) stopAudio();
    azkarView.style.display = "none";
    tasbihView.style.display = "";
    progressWrap.style.display = "none";
    setActiveBtn(btnTasbih);
  });

  // Tasbih logic
  const tasbihCountEl = document.getElementById("tasbihCount");
  const tasbihPhraseEl = document.getElementById("tasbihPhrase");
  tasbihCountEl.textContent = state.tasbihCount;
  tasbihPhraseEl.textContent = tasbihPhrases[state.tasbihIdx];

  document.getElementById("tasbihTap").addEventListener("click", ()=>{
    state.tasbihCount++;
    tasbihCountEl.textContent = state.tasbihCount;
    localStorage.setItem("tasbih_count", state.tasbihCount);
    if(navigator.vibrate) navigator.vibrate(6);
  });
  document.getElementById("tasbihReset").addEventListener("click", ()=>{
    state.tasbihCount = 0;
    tasbihCountEl.textContent = 0;
    localStorage.setItem("tasbih_count", 0);
  });
  document.getElementById("tasbihPhraseSwap").addEventListener("click", ()=>{
    state.tasbihIdx = (state.tasbihIdx+1) % tasbihPhrases.length;
    tasbihPhraseEl.textContent = tasbihPhrases[state.tasbihIdx];
  });

  // التعرف التلقائي على الوقت: أذكار الصباح فى الصباح، وأذكار المساء فى الليل
  showAzkar(getAutoMode());

  // إعادة التحقق من الوقت دوريًا (كل دقيقة) لتحديث الوضع تلقائيًا لو تركت الصفحة مفتوحة
  // عبر انتقال الوقت من صباح لمساء أو العكس — ما لم تختر الوضع بنفسك يدويًا
  setInterval(function(){
    if(userPickedManually) return;
    if(tasbihView.style.display !== "none") return; // المستخدم في شاشة السبحة، لا تُقاطعه
    const auto = getAutoMode();
    if(auto !== state.mode) showAzkar(auto);
  }, 60000);

  // كذلك أعد التحقق فور عودة المستخدم للصفحة (مثلاً بعد غلق الشاشة طوال الليل)
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState !== "visible") return;
    if(userPickedManually) return;
    if(tasbihView.style.display !== "none") return;
    const auto = getAutoMode();
    if(auto !== state.mode) showAzkar(auto);
  });

  // hijri-ish / gregorian date display
  document.getElementById("todayDate").textContent = new Date().toLocaleDateString("ar-EG", { weekday:"long", year:"numeric", month:"long", day:"numeric" });

  // stars for evening
  const starsHost = document.getElementById("stars");
  for(let i=0;i<40;i++){
    const s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random()*100+"%";
    s.style.left = Math.random()*100+"%";
    s.style.animationDelay = (Math.random()*3)+"s";
    starsHost.appendChild(s);
  }
})();
</script>
</body>
</html>
